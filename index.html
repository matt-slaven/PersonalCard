  <main class="pcard" aria-label="Tarjeta de presentación de Matt Slaven">
    <!-- Capa de marca de agua SLVN con recorte bitono sincronizado con la línea divisoria -->
    <div class="watermark-layer" aria-hidden="true">
      <div class="watermark-clip watermark-clip--grey">
        <svg class="watermark-svg"><use href="#slvn-mark"/></svg>
      </div>
      <div class="watermark-clip watermark-clip--blue">
        <svg class="watermark-svg"><use href="#slvn-mark"/></svg>
      </div>
    </div>

    <!-- Panel Izquierdo (Horizontal) / Superior (Vertical): Identidad y Contacto -->

      <div class="info-block">
        <header class="identity">
          <h1 class="identity__name">Matt Slaven</h1>
          <ul class="identity__roles" aria-label="Especialidades profesionales">
            <li>COMPOSITOR AUDIOVISUAL</li>
            <li>PRODUCTOR MUSICAL</li>
            <li>INGENIERO DE MEZCLA</li>
          </ul>
        </header>

        <address class="contact-list">
          <a class="contact-item contact-item--phone" href="https://wa.me/5491125183393" target="_blank" rel="noopener noreferrer" aria-label="WhatsApp o teléfono: +54 9 11 2518-3393">
            <span class="contact-item__icon" aria-hidden="true">
              <img src="./assets/phone.svg" alt="" width="35" height="35">
            </span>
            <span class="contact-item__text">+54 9 11 2518-3393</span>
          </a>

          <a class="contact-item contact-item--mail" href="mailto:slaven@mattslaven.com" aria-label="Correo electrónico: slaven@mattslaven.com">
            <span class="contact-item__icon" aria-hidden="true">
              <img src="./assets/mail.svg" alt="" width="35" height="27">
            </span>
            <span class="contact-item__text">slaven@mattslaven.com</span>
          </a>

          <a class="contact-item contact-item--web" href="https://www.mattslaven.com" target="_blank" rel="noopener noreferrer" aria-label="Sitio web oficial: www.mattslaven.com">
            <span class="contact-item__icon" aria-hidden="true">
              <img src="./assets/web.svg" alt="" width="35" height="36">
            </span>
            <span class="contact-item__text">www.mattslaven.com</span>
          </a>
        </address>
      </div>
    </section>

    <!-- Panel Derecho (Horizontal) / Inferior (Vertical): Código QR y Linktree -->
    <section class="panel panel--blue" aria-label="Código QR de acceso a redes y portfolio">
      <div class="qr-block">
        <a class="qr-link" href="https://linktr.ee/mattslaven" target="_blank" rel="noopener noreferrer" aria-label="Escanear o abrir Linktree: linktr.ee/mattslaven">
          <img class="qr-link__img" src="./assets/qr.svg" alt="Código QR hacia linktr.ee/mattslaven" width="260" height="260">
          <span class="qr-link__caption">linktr.ee/mattslaven</span>
        </a>

        <!-- Bloque de contacto secundario exclusivo para la variante vertical V3 -->
        <div class="qr-footer-contacts" aria-hidden="true">
          <a class="contact-item contact-item--phone" href="https://wa.me/5491125183393" target="_blank" rel="noopener noreferrer" tabindex="-1">
            <span class="contact-item__icon"><img src="./assets/phone.svg" alt="" width="35" height="35"></span>
            <span class="contact-item__text">+54 9 11 2518-3393</span>
          </a>
          <a class="contact-item contact-item--mail" href="mailto:slaven@mattslaven.com" tabindex="-1">
            <span class="contact-item__icon"><img src="./assets/mail.svg" alt="" width="35" height="27"></span>
            <span class="contact-item__text">slaven@mattslaven.com</span>
          </a>
          <a class="contact-item contact-item--web" href="https://www.mattslaven.com" target="_blank" rel="noopener noreferrer" tabindex="-1">
            <span class="contact-item__icon"><img src="./assets/web.svg" alt="" width="35" height="36"></span>
            <span class="contact-item__text">www.mattslaven.com</span>
          </a>
        </div>
      </div>

  <!-- Selector de propuestas visuales (oculto en producción; solo se activa con ?preview=1) -->
  <nav class="proposal-switcher" id="proposal-switcher" hidden aria-label="Comparador de propuestas verticales">
    <span class="proposal-switcher__label">Versión Vertical:</span>
    <button type="button" data-set-variant="1" class="is-active">V1 · Editorial Completa</button>
    <button type="button" data-set-variant="2">V2 · Sin Teléfono</button>
    <button type="button" data-set-variant="3">V3 · Foco QR + Pie</button>
  </nav>

  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const variant = params.get('v');
      if (variant === '1' || variant === '2' || variant === '3') {
        document.body.setAttribute('data-variant', variant);
      }

      if (params.get('preview') === '1') {
        const switcher = document.getElementById('proposal-switcher');
        if (switcher) {
          switcher.hidden = false;
          const buttons = switcher.querySelectorAll('button[data-set-variant]');
          const updateActive = (v) => {
            document.body.setAttribute('data-variant', v);
            buttons.forEach((btn) => {
              btn.classList.toggle('is-active', btn.getAttribute('data-set-variant') === v);
            });
          };
          updateActive(document.body.getAttribute('data-variant') || '1');
          buttons.forEach((btn) => {
            btn.addEventListener('click', () => updateActive(btn.getAttribute('data-set-variant')));
          });
        }
      }
    })();
  </script>
